<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Virtual Hospital Staff Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@500;600&family=Host+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one directory, one card per agent, every card built the same way: face, name, what it covers, what it reads,
   what it is doing now, one action. A quiet status filter replaces the stat tiles and dropdowns.
   Light mode only, as the Asklevia identity requires; every colour is set explicitly. */
:root {
  color-scheme: light;
  --paper: #F7F8FB; --white: #FFFFFF; --ink: #0F1222; --graphite: #4A5068; --mute: #6B7189; --hair: #E3E6EE; --hair-2: #EEF0F5;
  --indigo: #2B2FD9; --indigo-50: #EEEFFD; --verdant: #13A06B; --verdant-50: #E8F6EF; --warn: #9A5B00; --warn-50: #FBF1E2;
  --display: "Funnel Display", "Host Grotesk", ui-sans-serif, system-ui, sans-serif;
  --body: "Host Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 1px 2px rgba(15,18,34,.04), 0 10px 28px rgba(31,36,90,.06);
  --ease: cubic-bezier(.2,.7,.2,1);
}
* { box-sizing: border-box; }
html, body { background: var(--paper); }
body { color: var(--ink); font: 400 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 8px; }

/* ---------- platform shell ---------- */
.top { background: var(--white); border-bottom: 1px solid var(--hair); }
.bar { display: flex; align-items: center; gap: 14px; padding: 12px 24px 4px; }
.vh { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); }
.vh img { width: 24px; height: 24px; }
.vh b { font: 500 20px var(--display); letter-spacing: -.015em; }
.back { height: 22px; padding: 0 9px; border: 1px solid var(--hair); border-radius: 6px; background: var(--white); font-size: 11.5px; color: var(--graphite); cursor: pointer; }
.bell { margin-left: auto; width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--hair); background: var(--white); display: grid; place-items: center; cursor: pointer; position: relative; color: var(--graphite); }
.bell svg { width: 17px; height: 17px; }
.bell i { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--indigo); border: 2px solid var(--white); }
.tabs { display: flex; gap: 2px; padding: 0 16px; overflow-x: auto; scrollbar-width: none; }
.tab { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 10px; border: 1px solid transparent; border-radius: 10px; background: none; font-size: 13.5px; color: var(--graphite); cursor: pointer; white-space: nowrap; flex: none; margin: 4px 0 6px; text-decoration: none; }
.tab svg { width: 15px; height: 15px; }
.tab .n { color: var(--mute); margin-left: 2px; }
.tab:hover { color: var(--ink); background: var(--paper); }
.tab.on { border-color: var(--indigo); color: var(--ink); font-weight: 600; background: var(--white); }

.wrap { width: min(1440px, calc(100% - 48px)); margin-inline: auto; }

/* ---------- head ---------- */
.head { padding-block: 26px 18px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; }
.head h1 { margin: 0; font: 600 30px/1.15 var(--display); letter-spacing: -.02em; }
.head p { margin: 6px 0 0; color: var(--graphite); font-size: 15.5px; max-width: 62ch; }
.seg { display: inline-flex; background: var(--white); border: 1px solid var(--hair); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { height: 32px; padding: 0 12px; border: 0; border-radius: 9px; background: none; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--graphite); display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hair); }
.seg em { font-style: normal; font-size: 12px; color: var(--mute); font-variant-numeric: tabular-nums; }

/* ---------- the roster ---------- */
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; padding-bottom: 20px; }
.agent { position: relative; background: var(--white); border: 1px solid var(--hair); border-radius: 18px; box-shadow: var(--shadow); padding: 18px 18px 16px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px; min-width: 0; transition: transform .3s var(--ease), box-shadow .3s var(--ease); }
.agent:hover { transform: translateY(-2px); box-shadow: 0 1px 2px rgba(15,18,34,.04), 0 16px 36px rgba(31,36,90,.10); }
.agent[hidden] { display: none; }
.who { display: flex; align-items: center; gap: 14px; min-width: 0; }
.face { width: 64px; height: 64px; border-radius: 50%; flex: none; overflow: hidden; box-shadow: 0 6px 16px rgba(31,36,90,.12); transition: transform .45s var(--ease), filter .4s; }
.face svg { width: 100%; height: 100%; display: block; }
.agent:hover .face { transform: translateY(-3px) scale(1.05); }
.who h2 { margin: 0; font: 600 18px/1.2 var(--display); letter-spacing: -.015em; }
.who .ai { display: inline-flex; align-items: center; gap: 6px; margin-top: 3px; font-size: 12.5px; color: var(--mute); }
.who .ai i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.covers { margin: 0; font-size: 14px; color: var(--graphite); line-height: 1.45; }
.facts { margin: 0; display: grid; gap: 7px; font-size: 13.5px; align-content: start; }
.facts div { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 10px; }
.facts dt { color: var(--mute); }
.facts dd { margin: 0; color: var(--ink); min-width: 0; }
.facts a { color: var(--indigo); text-decoration: none; font-weight: 500; }
.facts a:hover { text-decoration: underline; }
.act { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-top: 1px solid var(--hair-2); padding-top: 12px; }
.status { position: relative; }
.status > button { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--hair); background: var(--white); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.status > button i { width: 8px; height: 8px; border-radius: 50%; }
.status > button svg { width: 11px; height: 11px; color: var(--mute); }
.s-duty i { background: var(--verdant); box-shadow: 0 0 0 3px rgba(19,160,107,.15); }
.s-consult i { background: var(--indigo); box-shadow: 0 0 0 3px rgba(43,47,217,.14); }
.s-off i { background: #B9BFCD; }
.menu { position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 5; background: var(--white); border: 1px solid var(--hair); border-radius: 12px; box-shadow: 0 16px 36px rgba(31,36,90,.14); padding: 4px; display: grid; min-width: 150px; }
.menu button { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 0; border-radius: 8px; background: none; font-size: 13.5px; cursor: pointer; text-align: left; }
.menu button:hover, .menu button[aria-checked="true"] { background: var(--paper); }
.menu button i { width: 8px; height: 8px; border-radius: 50%; }
.chat { height: 32px; padding: 0 14px; border-radius: 10px; border: 0; background: var(--indigo-50); color: var(--indigo); font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.chat:hover { background: var(--indigo); color: #fff; }
.chat svg { width: 14px; height: 14px; }
.chat:disabled { background: #E7E9F1; color: var(--mute); cursor: not-allowed; }
.add { border: 1.5px dashed #C9CEDA; border-radius: 18px; background: transparent; display: grid; place-content: center; justify-items: center; gap: 8px; text-align: center; padding: 24px; cursor: pointer; color: var(--graphite); min-height: 260px; transition: border-color .2s, background .2s; }
.add:hover { border-color: var(--indigo); background: var(--white); color: var(--ink); }
.add span.plus { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--indigo-50); color: var(--indigo); }
.add span.plus svg { width: 18px; height: 18px; }
.add b { font: 600 16px var(--display); color: var(--ink); }
.add small { font-size: 13px; max-width: 24ch; }
.empty { grid-column: 1 / -1; padding: 40px 0; text-align: center; color: var(--mute); }
.disc { padding-bottom: 28px; font-size: 12.5px; color: var(--mute); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; opacity: 0; pointer-events: none; transition: all .3s var(--ease); z-index: 40; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- living faces (same motion language as the Case Room) ---------- */
.face .eye, .face .mouth, .face .talk, .face .hd, .face .nn, .face .led, .face .cheek, .face .pod, .face .beam { transform-box: fill-box; transform-origin: center; }
.face .eyes { transform: translate(var(--gx, 0px), var(--gy, 0px)); transition: transform .5s var(--ease); }
.face .eye { animation: blink 5.6s infinite; animation-delay: var(--bd, 0s); }
.face .led { animation: led 2.8s ease-in-out infinite; animation-delay: var(--d, 0s); }
.face .trace { stroke-dasharray: 260; animation: trace 2.6s linear infinite; }
.face .nn { animation: nn 2.4s ease-in-out infinite; }
.face .nn:nth-of-type(2) { animation-delay: .3s; } .face .nn:nth-of-type(3) { animation-delay: .6s; }
.face .beam { animation: beam 3.2s ease-in-out infinite; }
.face .mouth, .face .talk, .face .cheek { transition: transform .35s var(--ease), opacity .25s; }
.face .hd { transition: transform .5s var(--ease); }
@keyframes bob { 50% { transform: translateY(-5px); } }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.08); } }
@keyframes led { 50% { opacity: .35; } }
@keyframes trace { from { stroke-dashoffset: 520; } to { stroke-dashoffset: 0; } }
@keyframes nn { 50% { transform: scale(1.35); } }
@keyframes beam { 50% { transform: scale(1.25); opacity: .2; } }
@keyframes perk { 35% { transform: translateY(-6px) scale(1.07); } }
.agent.s-consult .face .led { animation-duration: .9s; }
.agent.s-off .face { filter: grayscale(.8) opacity(.6); box-shadow: none; }
.agent.s-off .face .eye { animation: none; transform: scaleY(.28); }
.agent.s-off .face .led { animation: none; opacity: .3; }
.agent.s-off .who h2, .agent.s-off .covers { color: var(--mute); }
.agent .face.perk { animation: perk .6s var(--ease); }

@media (max-width: 1240px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .wrap { width: calc(100% - 32px); }
  .bar { padding: 10px 16px 2px; }
  .head h1 { font-size: 25px; }
  .grid { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .seg { width: 100%; overflow-x: auto; scrollbar-width: none; }
  .add { min-height: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>



<main id="roster">
  <section class="head wrap">
    <div>
      <h1>Staff Roster</h1>
      <p id="summary">Seven specialist AI agents. Each reasons from its own reference text, and a physician signs every report.</p>
    </div>
    <div class="seg" role="group" aria-label="Filter by status" id="filters">
      <button type="button" data-f="all" aria-pressed="true">All <em id="n-all">7</em></button>
      <button type="button" data-f="consult" aria-pressed="false">In consult <em id="n-consult">0</em></button>
      <button type="button" data-f="duty" aria-pressed="false">On duty <em id="n-duty">0</em></button>
      <button type="button" data-f="off" aria-pressed="false">Off duty <em id="n-off">0</em></button>
    </div>
  </section>

  <section class="grid wrap" id="grid" aria-label="Specialist agents"></section>
  <p class="disc wrap">These are AI agents, not clinicians. They draft; a physician reviews, edits and signs every report before it reaches a patient.</p>
</main>
<div class="toast" id="toast" role="status"></div>

0FA88A\"/></g></g></g></g><circle cx=\"512\" cy=\"512\" r=\"510\" fill=\"none\" stroke=\"#B7E5DC\" stroke-width=\"4\"/></svg>"};
  const $ = s => document.querySelector(s);
  const CASE_ROOM = 'https://claude.ai/artifact/QYqrRKnjtu91Y27LnTisYc';

  /* one record per agent; the order is the order of the avatar kit */
  const AGENTS = [
    { k: 'im', name: 'Internal Medicine', c: '#2B2FD9', book: "Harrison's Principles of Internal Medicine", covers: 'Diagnostic differentiation and inpatient work-up across organ systems.', status: 'consult' },
    { k: 'ca', name: 'Cardiology', c: '#1F7BEA', book: "Braunwald's Heart Disease", covers: 'Chest pain, arrhythmia, heart failure and severe hypertension.', status: 'consult' },
    { k: 'ne', name: 'Neurology', c: '#5B3DF5', book: "Adams and Victor's Principles of Neurology", covers: 'Stroke, seizure, headache and altered consciousness.', status: 'consult' },
    { k: 'su', name: 'Surgery', c: '#13A06B', book: "Schwartz's Principles of Surgery", covers: 'Acute abdomen, trauma and operative risk.', status: 'consult' },
    { k: 'em', name: 'Emergency Medicine', c: '#0E9AA7', book: "Tintinalli's Emergency Medicine", covers: 'Triage, resuscitation and time-critical care.', status: 'consult' },
    { k: 'id', name: 'Infectious Diseases', c: '#2E9FE6', book: "Mandell's Principles and Practice of Infectious Diseases", covers: 'Sepsis, antimicrobial stewardship, viral, bacterial and fungal infections.', status: 'consult', lead: true },
    { k: 'gy', name: 'Gynecology', c: '#0FA88A', book: 'Williams Gynecology', covers: 'Pelvic pain, abnormal bleeding and gynecologic surgery.', status: 'duty' },
  ];
  AVSVG.id = AVSVG.ob;
  const ST = { consult: 'In consult', duty: 'On duty', off: 'Off duty' };
  const DOT = { consult: '#2B2FD9', duty: '#13A06B', off: '#B9BFCD' };
  const CHEV = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>';

  const grid = $('#grid'); let filter = 'all';
  const now = a => a.status === 'consult'
    ? `<a href="#case" class="case-nav-link" data-tab="JOURNEY">Case VH-0417</a>${a.lead ? ' · lead' : ''}`
    : a.status === 'duty' ? 'Available for a new case' : 'Not taking cases';

  const card = (a, i) => {
    const el = document.createElement('article'); el.className = 'agent s-' + a.status; el.style.setProperty('--c', a.c);
    el.style.setProperty('--bd', (i * .9 + .5).toFixed(1) + 's'); el.style.setProperty('--d', (-i * .5).toFixed(1) + 's'); el.dataset.k = a.k;
    el.innerHTML = `
      <div class="who"><span class="face" aria-hidden="true">${AVSVG[a.k]}</span>
        <div><h2>${a.name}</h2><span class="ai"><i></i>AI agent</span></div></div>
      <p class="covers">${a.covers}</p>
      <dl class="facts">
        <div><dt>Reads</dt><dd>${a.book}</dd></div>
        <div><dt>Now</dt><dd class="now">${now(a)}</dd></div>
      </dl>
      <div class="act">
        <div class="status"><button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Status: ${ST[a.status]}. Change status"><i></i><span>${ST[a.status]}</span>${CHEV}</button></div>
        <button class="chat" type="button"${a.status === 'off' ? ' disabled' : ''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat</button>
      </div>`;
    const sb = el.querySelector('.status > button');
    sb.addEventListener('click', e => { e.stopPropagation(); openMenu(a, el, sb); });
    el.querySelector('.chat').addEventListener('click', () => {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'OPEN_CHAT', agentKey: a.k, agentName: a.name }, '*');
      } else {
        say(`Preview only. In the platform this opens a chat with the ${a.name} agent.`);
      }
    });
    const caseLink = el.querySelector('.case-nav-link');
    if (caseLink) {
      caseLink.addEventListener('click', (e) => {
        e.preventDefault();
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'NAVIGATE', tab: 'JOURNEY' }, '*');
        }
      });
    }
    // the face perks up and looks towards the pointer while you are on its card
    const face = el.querySelector('.face');
    el.addEventListener('pointerenter', () => { if (a.status === 'off') return; face.classList.remove('perk'); void face.offsetWidth; face.classList.add('perk'); });
    el.addEventListener('pointermove', e => { const r = face.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2), d = Math.hypot(dx, dy) || 1, m = Math.min(1, d / 140);
      face.style.setProperty('--gx', (dx / d * 30 * m).toFixed(1) + 'px'); face.style.setProperty('--gy', (dy / d * 22 * m).toFixed(1) + 'px'); });
    el.addEventListener('pointerleave', () => { face.style.setProperty('--gx', '0px'); face.style.setProperty('--gy', '0px'); });
    return el;
  };

  /* status menu: one open at a time, closes on outside click or Escape */
  let openEl = null;
  const closeMenu = () => { if (!openEl) return; openEl.menu.remove(); openEl.btn.setAttribute('aria-expanded', 'false'); openEl = null; };
  const openMenu = (a, el, btn) => {
    if (openEl && openEl.btn === btn) { closeMenu(); return; } closeMenu();
    const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu');
    m.innerHTML = Object.entries(ST).map(([s, l]) => `<button type="button" role="menuitemradio" aria-checked="${a.status === s}" data-s="${s}"><i style="background:${DOT[s]}"></i>${l}</button>`).join('');
    m.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; a.status = b.dataset.s; closeMenu(); render(); say(`${a.name} agent set to ${ST[a.status].toLowerCase()}.`); });
    btn.parentElement.appendChild(m); btn.setAttribute('aria-expanded', 'true'); openEl = { menu: m, btn }; m.querySelector('[aria-checked="true"]').focus();
  };
  document.addEventListener('click', e => { if (openEl && !openEl.menu.contains(e.target)) closeMenu(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && openEl) { const b = openEl.btn; closeMenu(); b.focus(); } });

  const render = () => {
    grid.innerHTML = '';
    const shown = AGENTS.filter(a => filter === 'all' || a.status === filter);
    shown.forEach((a, i) => grid.appendChild(card(a, AGENTS.indexOf(a))));
    if (filter === 'all') {
      const add = document.createElement('button'); add.type = 'button'; add.className = 'add';
      add.innerHTML = '<span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><b>Add a specialist agent</b><small>Choose a specialty and the reference text it reasons from.</small>';
      add.addEventListener('click', () => {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'OPEN_REGISTER' }, '*');
        } else {
          say('Preview only. In the platform this opens agent registration.');
        }
      });
      grid.appendChild(add);
    } else if (!shown.length) {
      const e = document.createElement('p'); e.className = 'empty'; e.textContent = `No agents are ${ST[filter].toLowerCase()} right now.`; grid.appendChild(e);
    }
    const n = s => AGENTS.filter(a => a.status === s).length;
    $('#n-all').textContent = AGENTS.length; $('#n-consult').textContent = n('consult'); $('#n-duty').textContent = n('duty'); $('#n-off').textContent = n('off');
  };
  $('#filters').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; filter = b.dataset.f;
    document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); render(); });

  const toast = $('#toast'); let tt;
  const say = m => { toast.textContent = m; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('on'), 3000); };
  document.querySelectorAll('.tab[data-tab]').forEach(b => b.addEventListener('click', () => say('This preview builds the Staff Roster only.')));
  render();
  const on = $('.tab.on'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'nearest' });
})();
</script>
