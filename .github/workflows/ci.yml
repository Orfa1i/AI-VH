name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    name: Lint, Scan, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pydantic pydantic-settings pyyaml fastapi httpx python-multipart

      - name: Run Secret Scanner
        run: |
          python scripts/scan_secrets.py

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Mypy Type Checker
        run: |
          mypy src/vh

      - name: Run Full Test Suite
        run: |
          pytest -v

  frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify Frontend Production Build
        working-directory: frontend
        run: pnpm run build
